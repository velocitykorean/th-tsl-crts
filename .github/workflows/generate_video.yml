name: Generate YouTube Video

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Target video duration in minutes'
        required: true
        default: '20.0'
      topic:
        description: 'Custom topic override (leave blank for automatic curriculum)'
        required: false
        default: ''
      preview_seconds:
        description: 'Preview seconds (e.g. 30.0 for quick test, 0 for full video)'
        required: false
        default: '0'
      force_publish:
        description: 'Force upload regardless of scheduled day of week (true/false)'
        required: false
        default: 'false'
        type: boolean
  schedule:
    - cron: '0 14 * * *' # Runs daily at 2:00 PM UTC (YouTube: Mon/Wed/Fri, Facebook: Daily)

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg & Audio Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1

      - name: Cache Kokoro AI Models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-models-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            kokoro-v1.0-models-

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Kokoro Model Weights (if not cached)
        run: |
          mkdir -p models
          if [ ! -f "models/kokoro-v1.0.onnx" ]; then
            echo "Downloading kokoro-v1.0.onnx from GitHub Releases..."
            curl -L -o models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          fi
          if [ ! -f "models/voices-v1.0.bin" ]; then
            echo "Downloading voices-v1.0.bin from GitHub Releases..."
            curl -L -o models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          fi
          ls -lh models/

      - name: Setup Secrets & Tokens
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then
            echo "$YOUTUBE_TOKEN_JSON" > token.json
            echo "[Runner] Injected YouTube token secret."
          fi

      - name: Execute Autonomous Video Pipeline
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          CMD="python auto_pipeline.py --duration ${{ github.event.inputs.duration || '20.0' }}"
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            CMD="$CMD --topic \"${{ github.event.inputs.topic }}\""
          fi
          if [ "${{ github.event.inputs.preview_seconds }}" != "0" ] && [ -n "${{ github.event.inputs.preview_seconds }}" ]; then
            CMD="$CMD --preview ${{ github.event.inputs.preview_seconds }}"
          fi
          if [ "${{ github.event.inputs.force_publish }}" = "true" ]; then
            CMD="$CMD --force-publish"
          fi
          echo "Executing: $CMD"
          eval $CMD

      - name: Upload Video & Thumbnail Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tesla-currents-video-package
          path: |
            output/*.mp4
            output/*.jpg
            output/*.json
          retention-days: 14

      - name: Commit & Push Updated History Registry
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add published_videos.json history.json history.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(history): record newly produced episode [skip ci]" && git push)
        continue-on-error: true
